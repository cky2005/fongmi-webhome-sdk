<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WebHome SDK Demo</title>
<style>
  :root {
    --bg: #0c1014;
    --panel: rgba(255,255,255,0.06);
    --panel-strong: rgba(255,255,255,0.10);
    --line: rgba(255,255,255,0.12);
    --text: #e8e8e8;
    --text-dim: #a0a4aa;
    --accent: #0f766e;
    --accent-strong: #14b8a6;
    --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h2 { font-size: 16px; margin: 24px 0 10px; color: var(--text-dim); font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: block; width: 100%; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text);
    font-size: 14px; text-align: left; cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .btn:hover { background: var(--panel-strong); }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn.danger { background: rgba(185,28,28,0.7); border-color: rgba(185,28,28,0.7); }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  pre {
    background: rgba(0,0,0,0.3); border-radius: 6px; padding: 10px;
    font-size: 12px; overflow-x: auto; max-height: 220px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .status { color: var(--text-dim); font-size: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  input, select {
    width: 100%; padding: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-size: 14px; margin-bottom: 8px;
  }
</style>
</head>
<body>
<h1>WebHome SDK Demo</h1>
<div class="status" id="status">Initializing...</div>

<h2>Network (fm.req)</h2>
<div class="row">
  <input id="netUrl" value="https://httpbin.org/json" placeholder="URL">
</div>
<div class="grid">
  <button class="btn" onclick="testGet()">GET (json)</button>
  <button class="btn" onclick="testPost()">POST (echo)</button>
</div>
<pre id="netResult">—</pre>

<h2>Resource (fm.res)</h2>
<div class="row">
  <input id="resUrl" value="https://picsum.photos/300/200.jpg" placeholder="Media URL">
</div>
<button class="btn" onclick="testRes()">生成 webResource URL</button>
<pre id="resResult">—</pre>

<h2>Player</h2>
<div class="grid">
  <button class="btn primary" onclick="testPlayUrl()">fm.play (直链)</button>
  <button class="btn" onclick="testVod()">fm.vod (CSP 影片)</button>
</div>
<div class="grid">
  <button class="btn" onclick="testVodInline()">fm.vodInline (临时多集)</button>
  <button class="btn" onclick="testStatus()">fm.stat (播放状态)</button>
</div>

<h2>App</h2>
<div class="row">
  <input id="kw" value="测试关键词" placeholder="搜索关键词">
</div>
<div class="grid">
  <button class="btn" onclick="testSearch()">fm.search</button>
  <button class="btn" onclick="testHistory()">fm.history</button>
</div>
<div class="grid">
  <button class="btn" onclick="window.fm.openVod()">fm.openVod</button>
  <button class="btn" onclick="window.fm.openSetting()">fm.openSetting</button>
</div>

<h2>Cache</h2>
<div class="row">
  <input id="ck" value="mykey" placeholder="key">
  <input id="cv" value="hello world" placeholder="value">
</div>
<div class="grid">
  <button class="btn primary" onclick="cacheSet()">set</button>
  <button class="btn" onclick="cacheGet()">get</button>
  <button class="btn" onclick="cacheDel()">del</button>
</div>
<pre id="cacheResult">—</pre>

<h2>Info</h2>
<div class="grid">
  <button class="btn" onclick="testDevice()">fm.device</button>
  <button class="btn" onclick="testSite()">fm.site</button>
  <button class="btn" onclick="testConfig()">fm.config</button>
  <button class="btn" onclick="testViewport()">fm.ui.getViewport</button>
</div>
<pre id="infoResult">—</pre>

<h2>Pan</h2>
<div class="grid">
  <button class="btn" onclick="testPanCheck()">fm.pan.check</button>
  <button class="btn" onclick="testPanPlay()">fm.pan.play</button>
</div>

<h2>Console</h2>
<pre id="log">// logs appear here</pre>

<script>
  var logEl = document.getElementById('log');
  function log() {
    var line = Array.prototype.slice.call(arguments).map(function (v) {
      if (typeof v === 'string') return v;
      try { return JSON.stringify(v); } catch (e) { return String(v); }
    }).join(' ');
    logEl.textContent += line + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setStatus(s) { document.getElementById('status').textContent = s; }
  function show(id, val) { document.getElementById(id).textContent = val; }

  function whenFm() {
    if (window.fm) return Promise.resolve(window.fm);
    return new Promise(function (r) { window.addEventListener('fmsdk', function () { r(window.fm); }, { once: true }); });
  }

  whenFm().then(function (fm) {
    setStatus('FM SDK ready. Client: ' + (window.fongmiClient ? JSON.stringify(window.fongmiClient) : 'n/a'));
    log('SDK ready, fongmiClient=', window.fongmiClient);
  }).catch(function (e) {
    setStatus('SDK init failed: ' + e);
  });

  // -------- Network --------
  function testGet() {
    var url = document.getElementById('netUrl').value;
    window.fm.req(url, { method: 'GET', responseType: 'json', timeout: 15 })
      .then(function (r) { show('netResult', JSON.stringify(r.json(), null, 2)); log('GET ok status=' + r.status); })
      .catch(function (e) { show('netResult', 'ERR: ' + e.message); log('GET failed', e); });
  }
  function testPost() {
    var url = document.getElementById('netUrl').value;
    window.fm.req(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hello: 'webhome', time: Date.now() }),
      responseType: 'json',
      timeout: 15
    }).then(function (r) { show('netResult', JSON.stringify(r.json(), null, 2)); })
      .catch(function (e) { show('netResult', 'ERR: ' + e.message); });
  }

  // -------- Resource --------
  function testRes() {
    var url = document.getElementById('resUrl').value;
    var wrapped = window.fm.res(url, { headers: { Referer: location.href } });
    show('resResult', wrapped);
    log('res ->', wrapped);
  }

  // -------- Player --------
  function testPlayUrl() {
    var url = 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4';
    window.fm.play(url, 'Big Buck Bunny (test)', {
      headers: { Referer: 'https://example.com/' },
      credentials: 'include'
    }).then(function () { log('play ok'); }).catch(function (e) { log('play failed', e); });
  }
  function testVod() {
    window.fm.vod('webhome', 'demo-vod-1', '示例影片', 'https://picsum.photos/300/450.jpg', {
      wallPic: 'https://picsum.photos/1280/720.jpg'
    }).then(function () { log('vod ok'); }).catch(function (e) { log('vod failed', e); });
  }
  function testVodInline() {
    // 注册 resolver
    window.__fmWebHomeInlineResolver = function (ep) {
      log('inline resolve', ep);
      return Promise.resolve({
        url: 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4',
        format: 'video/mp4'
      });
    };
    window.fm.vodInline({
      vod_name: '示例多集',
      vod_pic: 'https://picsum.photos/300/450.jpg',
      wallPic: 'https://picsum.photos/1280/720.jpg',
      vod_play_from: 'WebHome',
      mark: '02',
      episodes: [
        { name: '01', url: 'ep://1' },
        { name: '02', url: 'ep://2' },
        { name: '03', url: 'ep://3' }
      ]
    }).then(function () { log('vodInline ok'); }).catch(function (e) { log('vodInline failed', e); });
  }
  function testStatus() {
    window.fm.stat().then(function (s) { show('infoResult', JSON.stringify(s, null, 2)); })
      .catch(function (e) { show('infoResult', 'ERR: ' + e.message); });
  }

  // -------- App --------
  function testSearch() {
    var kw = document.getElementById('kw').value;
    window.fm.search(kw).then(function () { log('search dispatched: ' + kw); });
  }
  function testHistory() {
    window.fm.history().then(function (h) { show('infoResult', JSON.stringify(h, null, 2)); });
  }

  // -------- Cache --------
  function cacheSet() {
    var k = document.getElementById('ck').value;
    var v = document.getElementById('cv').value;
    window.fm.cache.set(k, v, 'demo').then(function () { log('cache.set', k, v); });
  }
  function cacheGet() {
    var k = document.getElementById('ck').value;
    window.fm.cache.get(k, 'demo').then(function (v) {
      show('cacheResult', 'value: ' + v);
      log('cache.get', k, '=', v);
    });
  }
  function cacheDel() {
    var k = document.getElementById('ck').value;
    window.fm.cache.del(k, 'demo').then(function () { log('cache.del', k); });
  }

  // -------- Info --------
  function testDevice() {
    window.fm.device().then(function (d) { show('infoResult', JSON.stringify(d, null, 2)); });
  }
  function testSite() {
    window.fm.site().then(function (s) { show('infoResult', JSON.stringify(s, null, 2)); });
  }
  function testConfig() {
    window.fm.config().then(function (c) { show('infoResult', JSON.stringify(c, null, 2)); });
  }
  function testViewport() {
    window.fm.ui.getViewport().then(function (v) { show('infoResult', JSON.stringify(v, null, 2)); });
  }

  // -------- Pan --------
  function testPanCheck() {
    window.fm.pan.check([
      { type: 'quark', url: 'https://pan.quark.cn/s/xxxx', password: '' }
    ]).then(function (r) { show('infoResult', JSON.stringify(r, null, 2)); })
      .catch(function (e) { show('infoResult', 'ERR: ' + e.message); });
  }
  function testPanPlay() {
    window.fm.pan.play({
      type: 'http',
      url: 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4',
      title: 'pan.play test'
    }).then(function () { log('pan.play ok'); });
  }

  // hook console -> log
  ['log', 'info', 'warn', 'error'].forEach(function (lvl) {
    var raw = console[lvl];
    console[lvl] = function () {
      try { raw.apply(console, arguments); } catch (e) {}
      log.apply(null, ['[' + lvl + ']'].concat(Array.prototype.slice.call(arguments)));
    };
  });
</script>
</body>
</html>
