// SDK build.gradle — FongMi WebHome SDK
// Plain java-library build. Compiles all Java in src/main/java against
// android.jar (compileOnly). Packages the classes plus assets into jars.

plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def findAndroidJar() {
    def candidates = [
        System.env.ANDROID_HOME,
        System.env.ANDROID_SDK_ROOT,
        '/usr/local/lib/android/sdk',
        '/opt/android-sdk',
        '/root/Android/Sdk',
        System.getProperty('user.home') + '/Android/Sdk',
        System.getProperty('user.home') + '/Library/Android/sdk'
    ].findAll { it != null }
    for (def home : candidates) {
        def jar = new File(home, 'platforms/android-34/android.jar')
        if (jar.exists()) return jar
    }
    return null
}

def androidJar = findAndroidJar()
if (androidJar != null) {
    println "Using android.jar: ${androidJar}"
} else {
    println "WARNING: android.jar not found. Build may fail."
}

dependencies {
    if (androidJar != null) {
        compileOnly files(androidJar)
    }
    compileOnly 'androidx.annotation:annotation:1.7.0'
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'FongMi WebHome SDK',
            'Implementation-Version': project.version,
            'Built-By': 'FongMi WebHome SDK Builder'
        )
    }
    // 排除 stub Spider — 壳会自己提供真实的 com.github.catvod.crawler.Spider
    exclude '**/com/github/catvod/crawler/Spider*.class'
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

tasks.register('jarWithAssets', Jar) {
    archiveClassifier = 'assets'
    from 'src/main/assets'
    manifest {
        attributes('Implementation-Title': 'FongMi WebHome SDK (assets)')
    }
}
